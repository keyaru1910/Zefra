# ==============================================================================
# Zefra / PayCore - Cấu hình ứng dụng chính
# ==============================================================================

spring:
  application:
    name: zefra-paycore

  # Cấu hình múi giờ UTC cho Jackson khi serialize/deserialize ngày giờ
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paycore}
    username: ${DB_USERNAME:paycore}
    password: ${DB_PASSWORD:paycore_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaycoreHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      # Luôn dùng validate để đảm bảo Flyway là nguồn chân lý duy nhất cho schema DB
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:paycore_redis_secret}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never

# Cấu hình bảo mật JWT (Lưu ý: Khi deploy production PHẢI truyền JWT_SECRET qua biến môi trường >= 32 bytes)
paycore:
  security:
    jwt:
      secret: ${JWT_SECRET:ZefraPayCoreDevSecretKeyMustBeAtLeast32BytesLong2026!}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      issuer: ${JWT_ISSUER:zefra-paycore}
  fraud:
    review-threshold: 60
    block-threshold: 85

# Cấu hình Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.paycore: DEBUG
    org.flywaydb: INFO
    org.springframework.security: INFO
